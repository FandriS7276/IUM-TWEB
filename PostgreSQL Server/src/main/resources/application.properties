# =============================================================================
# application.properties
#
# Tip: copy this file to application-local.properties and fill in real values.
# Spring loads application.properties first; an active profile file overrides.
# Never commit credentials — use environment variables in production:
#   spring.datasource.password=${DB_PASSWORD}
# =============================================================================

# ── DataSource (PostgreSQL) ────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (Spring Boot's default since 2.x)
#
# WHY 15 CONNECTIONS:
#   The homepage fires 5 MongoDB requests in parallel, each of which may
#   trigger a PostgreSQL enrichment call. With 10 connections, all slots
#   fill up during peak traffic and new requests queue behind the 5s
#   connection-timeout. Bumping to 15 gives breathing room for concurrent
#   homepage loads without over-allocating (PostgreSQL's default max is 100).
#
# IDLE TIMEOUT (30s):
#   Connections sitting idle for 30s are returned to the OS. This keeps
#   the pool lean during quiet periods while avoiding the overhead of
#   re-establishing connections on every request.
#
# CONNECTION TIMEOUT (5s):
#   If no connection is available within 5s, the request fails fast
#   rather than hanging. This prevents cascading timeouts when the
#   pool is exhausted.
#
# MIN IDLE (5):
#   Always keep 5 warm connections ready. Without this, after a quiet
#   period the pool shrinks to 0, and the first batch of requests all
#   pay the TCP + TLS handshake cost simultaneously. 5 pre-warmed
#   connections means most requests get an instant connection.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=5000

# ── JPA / Hibernate ───────────────────────────────────────────────────────
# validate: Hibernate checks that entity mappings match the DB schema on
#           startup but does NOT alter any tables. Safe for production.
#           Use 'create-drop' only in early dev to recreate tables each run.
spring.jpa.hibernate.ddl-auto=validate

# Show SQL in logs during development — set to false in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we're on PostgreSQL so it picks the right dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ── Open-in-view: DISABLED ────────────────────────────────────────────────
# WHY THIS MATTERS:
#   By default Spring Boot keeps a Hibernate Session (and its DB connection)
#   open for the ENTIRE HTTP request — including JSON serialization in the
#   controller. This means a connection is held even while writing bytes
#   to the network socket, wasting pool capacity.
#
#   With open-in-view=false, the connection is returned to the pool the
#   moment the @Transactional service method finishes. The controller
#   then serializes the DTO without holding a connection. Combined with
#   the pool increase above, this roughly doubles effective throughput.
#
#   The trade-off: lazy-loaded JPA associations will throw
#   LazyInitializationException if accessed outside the service layer.
#   Since all our DTOs are fully populated in MovieService, this is safe.
spring.jpa.open-in-view=false

# ── Hibernate batch fetching ──────────────────────────────────────────────
# When Hibernate needs to initialize a collection of lazy associations,
# instead of N individual SELECTs it batches them into groups of 25.
# This reduces N+1 query patterns that might slip through.
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# ── Server ────────────────────────────────────────────────────────────────
server.port=8080

# ── Jackson JSON ─────────────────────────────────────────────────────────
# Omit null fields from JSON responses (cleaner API output)
spring.jackson.default-property-inclusion=non_null
# Dates as ISO strings, not timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.films.api=INFO
